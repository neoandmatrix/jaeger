dist:
  name: jaeger-v2-ai
  description: Jaeger v2 with AI Assistant Extension
  output_path: ./dist

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter v0.96.0 
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.96.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.96.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.96.0

extensions:
  - gomod: github.com/jaegertracing/jaeger/cmd/jaeger/internal/extension/ai_assistant v0.0.0
    path: ./cmd/jaeger/internal/extension/ai_assistant

replaces:
  # This might be needed if go.mod has local replacements, or consistency issues
  - github.com/jaegertracing/jaeger => ./
